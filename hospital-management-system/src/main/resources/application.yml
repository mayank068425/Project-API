spring:
  application:
    name: hospital-management-system

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:hms}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 068425
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      # Flyway owns the schema. ddl-auto: update lets an entity change silently
      # rewrite a table, and it will happily drop a column you renamed.
      ddl-auto: validate
    # FALSE, and this matters. Spring Boot defaults it to true, which keeps the
    # Hibernate session open for the whole request and hides lazy-loading
    # mistakes: a lazy association touched during JSON serialisation quietly
    # issues another query instead of failing. The cost is that every request
    # holds a database connection until the response is written, so under load
    # the pool is exhausted by requests that finished querying long ago.
    # Off, those mistakes surface as LazyInitializationException in development,
    # which is where you want to find them.
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 30
        order_inserts: true
        jdbc.time_zone: UTC
        # Logs a warning whenever a collection is paginated in memory, which is
        # what happens if a fetch join on a @OneToMany is ever combined with
        # Pageable. Silent by default, and catastrophic on a large table.
        query.fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    # Never return a stack trace or an internal message. The exception handler
    # decides what is safe to say.
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.hms: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql:3306/hms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
