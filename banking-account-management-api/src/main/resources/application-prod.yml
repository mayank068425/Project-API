# Production.
#
# Every secret is an environment variable with no default. A missing one fails at
# start-up, which is the right time to find out.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 20000
      leak-detection-threshold: 30000

  jpa:
    show-sql: false

  sql:
    init:
      # Off. Both scripts are idempotent, but running DDL at application start-up
      # means every instance in a rolling deploy races to alter the same tables.
      # Schema changes belong in a reviewed migration step.
      mode: ${SQL_INIT_MODE:never}

banking:
  jwt:
    secret: ${JWT_SECRET}
    # Fifteen minutes. Short, because this token authorises moving money; the
    # refresh token carries the session length instead.
    access-token-validity-seconds: ${JWT_ACCESS_VALIDITY:900}
    refresh-token-validity-seconds: ${JWT_REFRESH_VALIDITY:604800}

logging:
  level:
    root: WARN
    com.banking: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  # Off in production: the document enumerates every endpoint and its shape,
  # which is a map for anyone probing the API.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
